server {
    listen 80;
    listen [::]:80;
    server_name analytics.dotmads.com;
    client_max_body_size 25m;

    location / {
        # Same app as analytics.madsmonitor.com — the app is domain-agnostic (Host forwarded,
        # relative server-fn paths, host-scoped cookies), so both domains serve one deployment.
        # certbot --nginx adds the :443 SSL block + 80->443 redirect once DNS resolves.
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

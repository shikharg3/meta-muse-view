# IP-only pages — the CSV import and the scheduled Telegram reports — on the droplet's bare IP, and
# nothing else. See docs/csv-import.md and docs/scheduled-reports.md.
#
# Same `meta-web` process on :8787 as the domains. The app refuses /import and /scheduled-reports on any
# host not in IMPORT_HOSTS (src/server.ts, IP_ONLY_PATHS) and their server fns re-check the host, so
# this vhost only narrows what the IP serves: those pages and what they need. Everything else lands
# on /import.
#
# HTTPS is required, not optional: the session cookie is `Secure`, so on plain http:// the browser
# drops it and login bounces straight back to /login.
#
# Certificate: Let's Encrypt issues 6-day IP certificates (certbot >= 5.4, `--ip-address`). The apt
# certbot on this box is 2.9, so an isolated one lives in /opt/certbot-ip with its own config dir —
# the domains' certificates and their renewal are untouched:
#
#   /opt/certbot-ip/bin/certbot certonly --config-dir /etc/letsencrypt-ip \
#     --work-dir /var/lib/letsencrypt-ip --logs-dir /var/log/letsencrypt-ip \
#     --preferred-profile shortlived --webroot -w /var/www/acme --ip-address 159.65.110.111 \
#     --deploy-hook "systemctl reload nginx"
#
# Bootstrap order: enable this file with the 443 server commented out, reload, issue, uncomment.

map $uri $import_path {
    default 0;
    ~^/import$ 1;
    ~^/scheduled-reports$ 1;
    ~^/_serverFn/ 1;
    ~^/auth/ 1;
    ~^/login$ 1;
    ~^/assets/ 1;
    ~^/favicon\.svg$ 1;
    ~^/dot-logo-white\.png$ 1;
}

server {
    listen 80;
    server_name 159.65.110.111;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # default_server: browsers send no SNI for an IP, so without it nginx would answer with the first
    # domain's certificate. Domain requests carry SNI and still reach their own server blocks.
    listen 443 ssl default_server;
    server_name 159.65.110.111;
    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt-ip/live/159.65.110.111/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/159.65.110.111/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # Login lands on "/", the dashboard shell's links on everything else: all go to the import.
        if ($import_path = 0) {
            return 302 /import;
        }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

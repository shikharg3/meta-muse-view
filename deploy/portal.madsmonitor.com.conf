# Client portal — its own hostname, so a client never sees the internal dashboard's URL.
#
# Same `meta-web` process on :8787 as analytics.madsmonitor.com; the portal is a route group
# (/portal) inside the one app. This vhost narrows that host to the portal: its own paths and the
# static bundle are proxied, and everything else lands on /portal rather than the internal app's
# login prompt, which is not something to show a client.
#
# Both hostnames are listed so whichever DNS A record is created first works:
#   portal.madsmonitor.com  A  159.65.110.111
#   portal.dotmads.com      A  159.65.110.111
#
# TLS is added after DNS resolves (certbot uses an HTTP-01 challenge, so the record must exist):
#   certbot --nginx -d portal.madsmonitor.com --redirect
#
# Reachable prefixes. `map` lives in the http context, which is where sites-enabled is included.
map $uri $portal_path {
    default 0;
    ~^/portal 1;
    ~^/assets/ 1;
    ~^/favicon\.svg$ 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.madsmonitor.com portal.dotmads.com;
    client_max_body_size 25m;

    location / {
        # Bare host, or any internal-dashboard path, goes to the portal.
        if ($portal_path = 0) {
            return 302 /portal;
        }

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
